name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-openapi:
    name: Typecheck & OpenAPI Codegen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript checks across workspace
        run: pnpm run typecheck

      - name: Validate OpenAPI spec & generated clients
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react lib/api-zod

  build-and-test:
    name: Build, DB Schema & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desiri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d desiri_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/desiri_test
      PORT: "5000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and push Drizzle ORM schema
        run: pnpm --filter @workspace/db exec drizzle-kit push --force --config ./drizzle.config.ts

      - name: Seed isolated PostgreSQL test database
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ./scripts/seed.sql

      - name: Run workspace tests
        run: pnpm -r --if-present run test

      - name: Build frontend and backend
        run: pnpm run build

      - name: Smoke-test backend server against PostgreSQL
        run: |
          node ./apps/backend/dist/index.mjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:5000/api/healthz
          curl -fsS http://localhost:5000/api/products >/dev/null

